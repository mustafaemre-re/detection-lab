title: File Creation In Fabricated AppData ProgramData Directory
id: 9e4a2b70-8c15-4d3f-b6e2-1a7c9d0f5e33
status: experimental
description: |
    Companion to the process_creation rule above. Catches the drop before
    execution, which gives earlier warning and also fires when the payload is
    written but never runs.
references:
    - https://github.com/mustafaemre-re/detection-lab/blob/main/analysis/polydrop.md
author: Mustafa Emre
date: 2026/08/19
tags:
    - attack.defense-evasion
    - attack.t1036.005
logsource:
    category: file_event
    product: windows
detection:
    selection:
        TargetFilename|contains: '\AppData\Local\ProgramData\'
    condition: selection
falsepositives:
    - Unknown at time of writing. See note above.
level: high
