title: Modification Of Microsoft Compatibility Appraiser Scheduled Task
id: 5a7e3b18-2f60-4c9d-a1b4-8d6f2e0c3475
status: experimental
description: |
    Detects writes to the Microsoft Compatibility Appraiser scheduled task file.
    Hijacking an existing Microsoft-named task is stealthier than creating a new
    one, because responders and tooling that enumerate tasks by suspicious name
    will not flag it.

    This behaviour was NOT observed in the analysis referenced below - it is
    reported by VirusTotal's public sandbox for the same hash and is recorded in
    section 11.2 of that report. The rule is therefore written against
    third-party observation and has not been validated against first-hand
    telemetry.
references:
    - https://github.com/mustafaemre-re/detection-lab/blob/main/analysis/polydrop.md
author: Mustafa Emre
date: 2026/08/19
tags:
    - attack.persistence
    - attack.t1053.005
    - attack.defense-evasion
    - attack.t1036
logsource:
    category: file_event
    product: windows
detection:
    selection:
        TargetFilename|contains: '\System32\Tasks\Microsoft\Windows\Application Experience\Microsoft Compatibility Appraiser'
    filter_legit:
        Image|endswith:
            - '\svchost.exe'
            - '\TiWorker.exe'
            - '\TrustedInstaller.exe'
    condition: selection and not filter_legit
falsepositives:
    - Windows servicing and cumulative updates rewrite this task legitimately.
      The filter covers the common service accounts but is not exhaustive - expect
      tuning during patch windows.
level: high
