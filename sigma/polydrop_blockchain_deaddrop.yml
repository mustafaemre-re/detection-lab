title: Blockchain RPC Provider Contacted By Non-Browser Process
id: 3c8d1f52-6a94-4b07-8e3d-5f2b0c7a9d64
status: experimental
description: |
    Detects DNS lookups for public blockchain RPC providers from a process that
    is not a browser or a known wallet application.

    Malware uses public RPC endpoints to read C2 configuration from a smart
    contract acting as a dead drop. The contract cannot be seized and the RPC
    providers cannot be blocklisted without breaking legitimate services, so the
    detection opportunity is the *caller*, not the destination.

    POLYDROP queries three providers in failover order and issues an eth_call to
    contract 0x0E04c59f31E382D2B8A1637f4B9A5f04165EC48d (selector 0x44574e9b)
    whenever its primary WebSocket C2 is unreachable.

    NOTE: the domains below are legitimate infrastructure. Do NOT blocklist them.
    This rule is about which process is asking.
references:
    - https://github.com/mustafaemre-re/detection-lab/blob/main/analysis/polydrop.md
author: Mustafa Emre
date: 2026/08/19
tags:
    - attack.command-and-control
    - attack.t1102
    - attack.t1008
logsource:
    category: dns_query
    product: windows
detection:
    selection_rpc:
        QueryName:
            - 'polygon.lava.build'
            - 'polygon-mainnet.gateway.tatum.io'
            - 'api.zan.top'
            - 'gtm-rpc.zan.top'
            - 'regional.blockchain.tatum.io'
    filter_browsers:
        Image|endswith:
            - '\chrome.exe'
            - '\firefox.exe'
            - '\msedge.exe'
            - '\brave.exe'
            - '\opera.exe'
            - '\vivaldi.exe'
            - '\iexplore.exe'
    condition: selection_rpc and not filter_browsers
falsepositives:
    - Cryptocurrency wallet software (Exodus, Trust Wallet, MetaMask desktop)
    - Blockchain development tooling (Hardhat, Truffle, Foundry, node.exe)
    - Any in-house application legitimately reading on-chain data
    - Expect these to be common in a crypto-focused environment and rare to absent
      in a general corporate estate. Tune the browser filter into an allowlist of
      approved wallet binaries before deploying.
level: medium
